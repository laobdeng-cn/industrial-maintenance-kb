services:

  postgres:
    image: postgres:16-alpine
    container_name: maintenance-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: maintenance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


  qdrant:
    image: qdrant/qdrant:latest
    container_name: maintenance-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage


  backend:
    build:
      context: ./backend
    container_name: maintenance-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started


  worker:
    build:
      context: ./backend
    container_name: maintenance-worker
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app.celery_app",
        "worker",
        "--loglevel=info"
      ]
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    depends_on:
      - redis
      - postgres


  frontend:
    image: node:22-alpine
    container_name: maintenance-frontend
    working_dir: /app
    command:
      [
        "npm",
        "run",
        "dev",
        "--",
        "--host",
        "0.0.0.0"
      ]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend


volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  storage_data:
  frontend_node_modules:
